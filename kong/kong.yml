_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: http://auth-service:8080
    routes:
      - name: auth-login
        paths:
          - /api/v1/auth/login
        methods:
          - POST
          - OPTIONS
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 20
              policy: local
              limit_by: ip

      - name: auth-profiles
        paths:
          - /api/v1/profiles
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp

  - name: catalog-service
    url: http://catalog-service:8080
    routes:
      - name: catalog-home
        paths:
          - /api/v1/home
        methods:
          - GET
          - OPTIONS
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
          # The limit values are a proposal: spec.md 6 leaves them open. Kong adds Retry-After to the 429.
          - name: rate-limiting
            config:
              minute: 120
              policy: local
              limit_by: ip

  - name: telemetry-service
    url: http://telemetry-service:8080
    routes:
      - name: telemetry-ping
        paths:
          - /api/v1/telemetry/ping
        methods:
          - POST
          - OPTIONS
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: rate-limiting
            config:
              minute: 600
              policy: local
              limit_by: ip

      - name: interactions-like
        paths:
          - /api/v1/interactions/like
        methods:
          - POST
          - OPTIONS
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: rate-limiting
            config:
              minute: 60
              policy: local
              limit_by: ip

consumers:
  - username: streamhub-auth
    jwt_secrets:
      - key: streamhub-auth
        algorithm: HS256
        secret: 334e3bb6052951659389173c0c1ce51837f88acee20ef0d10619f4a7ae738aa8

plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true
  # The browser calls Kong from http://localhost:3001 (Next.js dev server).
  - name: cors
    config:
      origins:
        - http://localhost:3001
        - http://127.0.0.1:3001
        - http://172.27.16.1:3001
      methods:
        - GET
        - POST
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - X-Correlation-ID
      exposed_headers:
        - X-Correlation-ID
        - Retry-After
      credentials: false
      max_age: 3600
  # Traces only (ADR 005). It also creates/propagates the W3C traceparent header.
  - name: opentelemetry
    config:
      endpoint: http://otel-collector:4318/v1/traces
      sampling_rate: 1.0
      propagation:
        extract:
          - w3c
        inject:
          - w3c
        default_format: w3c
      queue:
        max_batch_size: 200
  # Request and latency metrics by route, served at the Admin API /metrics.
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
  # Errors produced by Kong itself (jwt 401, rate-limiting 429, no route 404, upstream down 502/503/504)
  # use the standard error body of spec.md 1.4. Errors returned by the services are left untouched.
  - name: post-function
    config:
      header_filter:
        - |
          local status = kong.response.get_status()
          if status < 400 or kong.response.get_source() == "service" then
            return
          end
          local errors = {
            [401] = { "UNAUTHORIZED", "Missing, malformed, invalid or expired token." },
            [404] = { "NOT_FOUND", "The requested resource does not exist." },
            [405] = { "METHOD_NOT_ALLOWED", "The method is not allowed for this resource." },
            [413] = { "PAYLOAD_TOO_LARGE", "The request body is too large." },
            [429] = { "RATE_LIMITED", "Too many requests. Retry after the time given in Retry-After." },
            [502] = { "SERVICE_UNAVAILABLE", "A required service is unavailable." },
            [503] = { "SERVICE_UNAVAILABLE", "A required service is unavailable." },
            [504] = { "SERVICE_UNAVAILABLE", "A required service did not answer in time." },
          }
          local e = errors[status]
            or (status >= 500 and { "INTERNAL_ERROR", "Unexpected error." })
            or { "REQUEST_ERROR", "The request could not be processed." }
          -- Only characters that are safe inside a JSON string are kept from the client-supplied id.
          local id = kong.response.get_header("X-Correlation-ID") or kong.request.get_header("X-Correlation-ID")
          id = id and id:gsub("[^%w%-%._:]", "") or ""
          kong.ctx.shared.standard_error = '{"error":{"code":"' .. e[1] .. '","message":"' .. e[2]
            .. '","correlation_id":' .. (id ~= "" and ('"' .. id .. '"') or "null") .. '}}'
          kong.response.set_header("Content-Type", "application/json; charset=utf-8")
          kong.response.clear_header("Content-Length")
      body_filter:
        - |
          local body = kong.ctx.shared.standard_error
          if body and kong.response.get_raw_body() ~= nil then
            kong.response.set_raw_body(body)
          end

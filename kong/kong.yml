_format_version: "3.0"
_transform: true


services:
  - name: auth-service
    url: http://auth-service:8080
    routes:
      - name: auth-login
        paths:
          - /api/v1/auth/login
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 20
              policy: local
              limit_by: ip

      - name: auth-profiles
        paths:
          - /api/v1/profiles
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp

  - name: catalog-service
    url: http://catalog-service:8080
    routes:
      - name: catalog-home
        paths:
          - /api/v1/home
        methods:
          - GET
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
          # The limit values are a proposal: spec.md 6 leaves them open. Kong adds Retry-After to the 429.
          - name: rate-limiting
            config:
              minute: 120
              policy: local
              limit_by: ip

consumers:
  - username: streamhub-auth
    jwt_secrets:
      - key: streamhub-auth
        algorithm: HS256
        secret: 334e3bb6052951659389173c0c1ce51837f88acee20ef0d10619f4a7ae738aa8

plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true
  # Metrics at /metrics of the Admin API (port 8001), scraped by Prometheus
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
  # Traces sent to the OpenTelemetry Collector. Kong propagates the traceparent header, so the spans of the
  # services hang from the gateway span in Jaeger.
  - name: opentelemetry
    config:
      endpoint: http://otel-collector:4318/v1/traces
      resource_attributes:
        service.name: kong

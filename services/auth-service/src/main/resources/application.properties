spring.application.name=auth-service
server.port=8080

# PostgreSQL (Auth DB). Credentials come from the environment, never from the code.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (HS256). JWT_SECRET must have at least 32 characters.
jwt.secret=${JWT_SECRET}
jwt.issuer=streamhub-auth
jwt.expiration-seconds=3600

# Development accounts (see SeedDataRunner)
seed.enabled=${SEED_ENABLED:false}
seed.password=${SEED_PASSWORD:}

# Every log line carries the correlation id and the trace id (spec.md 1.3 and Feature 5)
logging.pattern.level=%5p [%X{correlationId:-}] [%X{traceId:-}]

management.endpoints.web.exposure.include=health

# Jaeger tracing (ADR 005): traces only.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http

spring.application.name=auth-service
server.port=8080

# PostgreSQL (Auth DB). Credentials come from the environment, never from the code.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (HS256). JWT_SECRET must have at least 32 characters.
jwt.secret=${JWT_SECRET}
jwt.issuer=streamhub-auth
jwt.expiration-seconds=3600

# Development accounts (see SeedDataRunner)
seed.enabled=${SEED_ENABLED:false}
seed.password=${SEED_PASSWORD:}

# Every log line carries the correlation id (spec.md 1.3)
logging.pattern.level=%5p [%X{correlationId:-}]

management.endpoints.web.exposure.include=health,prometheus

# Observability. Metrics are scraped by Prometheus at /actuator/prometheus (histogram buckets give the p95 in Grafana).
# Traces go to the OpenTelemetry Collector only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set
# (docker-compose.yml). Metrics are not pushed over OTLP: Prometheus pulls them.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.enabled=false

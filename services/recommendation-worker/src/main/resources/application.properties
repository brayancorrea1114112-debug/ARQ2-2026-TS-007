spring.application.name=recommendation-worker
server.port=8080

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:userArquitectura2}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:}

# Automatic acknowledgment: Spring retries and then rejects to the DLQ (default-requeue-rejected=false).
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_PREFETCH:250}
spring.rabbitmq.listener.simple.concurrency=${RABBITMQ_CONCURRENCY:4}
spring.rabbitmq.listener.simple.max-concurrency=${RABBITMQ_MAX_CONCURRENCY:8}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=5
# Joins the span of the HTTP request that produced the event (spec.md Feature 5).
spring.rabbitmq.listener.simple.observation-enabled=true

# Cassandra (Interactions DB = durable source of truth)
spring.cassandra.contact-points=${CASSANDRA_HOST:cassandra}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.local-datacenter=${CASSANDRA_DATACENTER:datacenter1}
spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE:streamhub}
spring.cassandra.schema-action=none
spring.cassandra.connect-timeout=5s
spring.cassandra.request-timeout=3s
spring.cassandra.pool.heartbeat-interval=30s

# Raw event history retention (days)
cassandra.history-ttl-days=${CASSANDRA_HISTORY_TTL_DAYS:90}

# Catalog & Home Service: genres used by the suggestion engine (ADR 009)
catalog.base-url=${CATALOG_URL:http://catalog-service:8080}
catalog.timeout=${CATALOG_TIMEOUT:2s}
catalog.genres-cache-ttl=${CATALOG_GENRES_CACHE_TTL:5m}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# Observability (Prometheus + OpenTelemetry/Jaeger)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}

logging.pattern.level=%5p [%X{correlationId:-}] [%X{traceId:-}]
logging.level.org.springframework.amqp=INFO
logging.level.com.streamhub=INFO

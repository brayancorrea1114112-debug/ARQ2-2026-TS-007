spring.application.name=catalog-service
server.port=8080

# JWT (HS256), verified again here even though Kong checks it at the edge.
# JWT_SECRET is shared with auth-service and must have at least 32 characters.
jwt.secret=${JWT_SECRET}
jwt.issuer=streamhub-auth

# Every log line carries the correlation id and the trace id (spec.md 1.3 and Feature 5)
logging.pattern.level=%5p [%X{correlationId:-}] [%X{traceId:-}]

management.endpoints.web.exposure.include=health
# The container healthcheck uses /actuator/health/liveness: it only says the process is alive. /actuator/health also
# reports Redis and MongoDB, which may be down while the service still answers the fallback Home.
management.endpoint.health.probes.enabled=true

# Jaeger tracing (ADR 005): traces only.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http

# Redis (precomputed Home views, written by the Recommendation Worker). The short timeouts matter: when Redis
# hangs, the Home must fall back to MongoDB quickly instead of making the client wait.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:250ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:250ms}

# MongoDB (Catalog DB). The URI may carry credentials, so it comes from the environment.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/streamhub}
catalog.mongodb.timeout=${MONGODB_TIMEOUT:500ms}

# How long the trending titles are kept in memory (they are the same for every profile)
catalog.trending-cache-ttl=${TRENDING_CACHE_TTL:60s}

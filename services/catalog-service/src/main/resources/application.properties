spring.application.name=catalog-service
server.port=8080

# JWT (HS256), verified again here even though Kong checks it at the edge.
# JWT_SECRET is shared with auth-service and must have at least 32 characters.
jwt.secret=${JWT_SECRET}
jwt.issuer=streamhub-auth

# Every log line carries the correlation id and the trace id (spec.md 1.3 and Feature 5)
logging.pattern.level=%5p [%X{correlationId:-}] [%X{traceId:-}]

management.endpoints.web.exposure.include=health,prometheus
# The container healthcheck uses /actuator/health/liveness. Cassandra remains lazy because cached responses do not need it.
management.endpoint.health.probes.enabled=true

# Observability (Prometheus + OpenTelemetry/Jaeger).
# Metrics are scraped by Prometheus at /actuator/prometheus.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.otlp.metrics.export.enabled=false

# Jaeger tracing (ADR 005): traces only.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http

# Redis cache-aside Home views. The short timeouts matter: when Redis hangs, the service rebuilds from
# MongoDB and Cassandra instead of making the client wait.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:250ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:250ms}
catalog.home-cache-ttl=${HOME_CACHE_TTL:15m}
catalog.continue-watching-cache-ttl=${CONTINUE_WATCHING_CACHE_TTL:24h}
catalog.cache-ttl-jitter=${CACHE_TTL_JITTER:2m}

# MongoDB (Catalog DB). The URI may carry credentials, so it comes from the environment.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/streamhub}
catalog.mongodb.timeout=${MONGODB_TIMEOUT:500ms}

# Cassandra (Interactions DB). Connections are only needed when rebuilding a cache miss.
spring.cassandra.contact-points=${CASSANDRA_HOST:localhost}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.local-datacenter=${CASSANDRA_DATACENTER:datacenter1}
spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE:streamhub}

# How long the trending titles are kept in memory (they are the same for every profile)
catalog.trending-cache-ttl=${TRENDING_CACHE_TTL:60s}

spring.application.name=telemetry-service
server.port=8080

# JWT (HS256), verified again here even though Kong checks it at the edge.
jwt.secret=${JWT_SECRET}
jwt.issuer=streamhub-auth

# RabbitMQ. The topology matches the queues and exchanges declared by the recommendation worker.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:userArquitectura2}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:Punto123969**-+}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Micrometer observations on the RabbitTemplate also propagate the W3C trace context.
spring.rabbitmq.template.observation-enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Jaeger tracing (ADR 005). Prometheus/Loki/Grafana are deliberately out of scope.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http

# Every log line carries the correlation id and the trace id (spec.md 1.3 and Feature 5).
logging.pattern.level=%5p [%X{correlationId:-}] [%X{traceId:-}]
logging.level.org.springframework.amqp=INFO
logging.level.com.streamhub=INFO

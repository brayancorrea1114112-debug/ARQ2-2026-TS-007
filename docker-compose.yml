services:
  # API Gateway
  kong:
    container_name: kong-arquitectura2
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_TRACING_INSTRUMENTATIONS: all
      KONG_TRACING_SAMPLING_RATE: "1.0"
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    healthcheck:
      test: [ "CMD", "kong", "health" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # data base
  postgres:
    container_name: postgres-arquitectura2
    image: postgres:16
    env_file:
      - ./infra/postgres/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U userArquitectura2 -d auth" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # services
  auth-service:
    container_name: auth-service-arquitectura2
    build: ./services/auth-service
    env_file:
      - ./services/auth-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  mongo:
    container_name: mongo-arquitectura2
    image: mongo:7
    env_file:
      - ./infra/mongo/.env
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Development catalog used to build Home entries on cache misses. Idempotent, runs once and exits.
  mongo-seed:
    container_name: mongo-seed-arquitectura2
    image: mongo:7
    env_file:
      - ./infra/mongo/.env
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./infra/mongo/seed.js:/seed.js:ro
    command: [ "sh", "-c", "mongosh mongodb://mongo:27017/streamhub --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet /seed.js" ]
    restart: "no"

  cassandra:
    container_name: cassandra-arquitectura2
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: streamhub
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandradata:/var/lib/cassandra
    ports:
      - "9042:9042"
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -e 'describe keyspaces'" ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  # Creates the keyspace and tables before the worker and Catalog service start.
  cassandra-init:
    container_name: cassandra-init-arquitectura2
    image: cassandra:4.1
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./infra/cassandra/init.cql:/init.cql:ro
    command: [ "cqlsh", "cassandra", "-f", "/init.cql" ]

  # cache
  redis:
    container_name: redis-arquitectura2
    image: redis:7
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # mensajes
  rabbitmq:
    container_name: rabbitmq-arquitectura2
    image: rabbitmq:3-management
    env_file:
      - ./infra/rabbitmq/.env
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  recommendation-worker:
    container_name: recommendation-worker-arquitectura2
    build: ./services/recommendation-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    env_file:
      - ./services/recommendation-worker/.env
    ports:
      - "8082:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  catalog-service:
    container_name: catalog-service-arquitectura2
    build: ./services/catalog-service
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    env_file:
      - ./services/catalog-service/.env
    ports:
      - "8083:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  telemetry-service:
    container_name: telemetry-service-arquitectura2
    build: ./services/telemetry-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    env_file:
      - ./services/telemetry-service/.env
    ports:
      - "${TELEMETRY_SERVICE_PORT:-8084}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # observability
  # Traces: Kong + services --OTLP--> otel-collector --> jaeger
  otel-collector:
    container_name: otel-collector-arquitectura2
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: [ "--config", "/etc/otelcol/config.yml" ]
    volumes:
      - ./otel-collector/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - jaeger
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  jaeger:
    container_name: jaeger-arquitectura2
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    restart: unless-stopped

  # Metrics: prometheus scrapes /actuator/prometheus of the services and Kong's /metrics
  prometheus:
    container_name: prometheus-arquitectura2
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Logs: alloy reads the logs of every container and pushes them to loki
  loki:
    container_name: loki-arquitectura2
    image: grafana/loki:3.1.0
    volumes:
      - lokidata:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  alloy:
    container_name: alloy-arquitectura2
    image: grafana/alloy:v1.3.1
    command: [ "run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy" ]
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    ports:
      - "12345:12345"
    restart: unless-stopped

  # Datasources and dashboards are provisioned from infra/grafana
  grafana:
    container_name: grafana-arquitectura2
    image: grafana/grafana:11.1.0
    env_file:
      - ./infra/grafana/.env
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - jaeger
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  cassandradata:
  redisdata:
  rabbitdata:
  prometheusdata:
  lokidata:
  grafanadata:

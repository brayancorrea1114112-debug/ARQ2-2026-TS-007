services:
  # API Gateway
  kong:
    container_name: kong-arquitectura2
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro

  # data base
  postgres:
    container_name: postgres-arquitectura2
    image: postgres:16
    environment:
      POSTGRES_USER: userArquitectura2
      POSTGRES_PASSWORD: "Punto123969**-+"
      POSTGRES_DB: auth
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userArquitectura2 -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  # services
  auth-service:
    container_name: auth-service-arquitectura2
    build: ./services/auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth
      DB_USER: userArquitectura2
      DB_PASSWORD: "Punto123969**-+"
      JWT_SECRET: 334e3bb6052951659389173c0c1ce51837f88acee20ef0d10619f4a7ae738aa8
      SEED_ENABLED: "true"
      SEED_PASSWORD: S3cret-pass
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8080"

  mongo:
    container_name: mongo-arquitectura2
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: userArquitectura2
      MONGO_INITDB_ROOT_PASSWORD: "Punto123969**-+"
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Development catalog for the Home fallback. Idempotent, runs once and exits.
  mongo-seed:
    container_name: mongo-seed-arquitectura2
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./infra/mongo/seed.js:/seed.js:ro
    command:
      [
        "mongosh",
        "mongodb://mongo:27017/streamhub",
        "--username",
        "userArquitectura2",
        "--password",
        "Punto123969**-+",
        "--authenticationDatabase",
        "admin",
        "--quiet",
        "/seed.js",
      ]
    restart: "no"

  cassandra:
    container_name: cassandra-arquitectura2
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: streamhub
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandradata:/var/lib/cassandra
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  # Creates the keyspace and tables before the workers start.
  cassandra-init:
    container_name: cassandra-init-arquitectura2
    image: cassandra:4.1
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./infra/cassandra/init.cql:/init.cql:ro
    command: ["cqlsh", "cassandra", "-f", "/init.cql"]

  # cache
  redis:
    container_name: redis-arquitectura2
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  # Development Home views so the catalog service can answer from cache. Idempotent.
  redis-seed:
    container_name: redis-seed-arquitectura2
    image: redis:7
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./infra/redis/seed.sh:/seed.sh:ro
    command: ["sh", "/seed.sh"]
    restart: "no"

  # mensajes
  rabbitmq:
    container_name: rabbitmq-arquitectura2
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: userArquitectura2
      RABBITMQ_DEFAULT_PASS: "Punto123969**-+"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  recommendation-worker:
    container_name: recommendation-worker-arquitectura2
    build: ./services/recommendation-worker
    depends_on:
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
      cassandra-init:
        condition: service_completed_successfully
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: userArquitectura2
      SPRING_RABBITMQ_PASSWORD: "Punto123969**-+"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_DATACENTER: datacenter1
      CASSANDRA_KEYSPACE: streamhub
      REBUILD_ON_STARTUP: "false"
      ADMIN_TOKEN: "streamhub-admin-token"
    ports:
      - "8082:8080"

  catalog-service:
    container_name: catalog-service-arquitectura2
    build: ./services/catalog-service
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
    environment:
      # Values come from .env (see .env.example), never from this file.
      JWT_SECRET: ${JWT_SECRET:-}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/streamhub}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8083:8080"

  telemetry-service:
    container_name: telemetry-service-arquitectura2
    build: ./services/telemetry-service
    depends_on:
      rabbitmq:
        condition: service_started
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: userArquitectura2
      SPRING_RABBITMQ_PASSWORD: "Punto123969**-+"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "${TELEMETRY_SERVICE_PORT:-8084}:8080"

  # observability
  otel-collector:
    container_name: otel-collector-arquitectura2
    image: otel/opentelemetry-collector-contrib:0.104.0
    ports:
      - "4317:4317"
      - "4318:4318"

  jaeger:
    container_name: jaeger-arquitectura2
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  prometheus:
    container_name: prometheus-arquitectura2
    image: prom/prometheus:v2.53.0
    volumes:
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"

  loki:
    container_name: loki-arquitectura2
    image: grafana/loki:3.1.0
    volumes:
      - lokidata:/loki
    ports:
      - "3100:3100"

  grafana:
    container_name: grafana-arquitectura2
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: userArquitectura2
      GF_SECURITY_ADMIN_PASSWORD: "Punto123969**-+"
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  pgdata:
  mongodata:
  cassandradata:
  redisdata:
  rabbitdata:
  prometheusdata:
  lokidata:
  grafanadata:

services:
  # API Gateway
  kong:
    container_name: kong-arquitectura2
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"
      - "8001:8001"

  # data base
  postgres:
    container_name: postgres-arquitectura2
    image: postgres:16
    environment:
      POSTGRES_USER: userArquitectura2
      POSTGRES_PASSWORD: "Punto123969**-+"
      POSTGRES_DB: auth
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mongo:
    container_name: mongo-arquitectura2
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: userArquitectura2
      MONGO_INITDB_ROOT_PASSWORD: "Punto123969**-+"
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"

  cassandra:
    container_name: cassandra-arquitectura2
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: streamhub
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandradata:/var/lib/cassandra
    ports:
      - "9042:9042"

  # cache
  redis:
    container_name: redis-arquitectura2
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  # mensajes
  rabbitmq:
    container_name: rabbitmq-arquitectura2
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: userArquitectura2
      RABBITMQ_DEFAULT_PASS: "Punto123969**-+"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # observability
  otel-collector:
    container_name: otel-collector-arquitectura2
    image: otel/opentelemetry-collector-contrib:0.104.0
    ports:
      - "4317:4317"
      - "4318:4318"

  jaeger:
    container_name: jaeger-arquitectura2
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  prometheus:
    container_name: prometheus-arquitectura2
    image: prom/prometheus:v2.53.0
    volumes:
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"

  loki:
    container_name: loki-arquitectura2
    image: grafana/loki:3.1.0
    volumes:
      - lokidata:/loki
    ports:
      - "3100:3100"

  grafana:
    container_name: grafana-arquitectura2
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: userArquitectura2
      GF_SECURITY_ADMIN_PASSWORD: "Punto123969**-+"
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  pgdata:
  mongodata:
  cassandradata:
  redisdata:
  rabbitdata:
  prometheusdata:
  lokidata:
  grafanadata:
